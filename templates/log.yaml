# =============================================================================
#  Логи Synapse: консоль (docker logs) + файл с ротацией в /data/logs/.
#  Файл важен: без него при разборе инцидентов смотреть нечего — консоль
#  теряется при перезапуске контейнера.
# =============================================================================
version: 1

formatters:
  precise:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    formatter: precise

  file:
    class: logging.handlers.RotatingFileHandler
    formatter: precise
    filename: /data/logs/homeserver.log
    maxBytes: 52428800      # 50 MiB
    backupCount: 5
    encoding: utf8

loggers:
  synapse.storage.SQL:
    # НЕ ставить DEBUG: захлёстывает журнал (в т.ч. содержимым событий)
    level: WARNING
  synapse.storage:
    level: WARNING
  synapse.http.site:
    level: WARNING
  synapse.replication.tcp.client:
    level: WARNING

root:
  level: INFO
  handlers: [console, file]
